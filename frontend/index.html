<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ReviewMind, AI-powered pull request reviews with line-anchored findings." />
    <meta name="theme-color" content="#0a0f1c" />
    <title>ReviewMind, AI pull request reviews</title>
    <script>
      // Apply the saved theme before first paint so light-mode users never see a dark flash.
      try {
        if (localStorage.getItem('reviewmind:theme') === 'light') document.documentElement.dataset.theme = 'light'
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
